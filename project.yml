name: JournalInsight
options:
  bundleIdPrefix: toby913
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: "YES"
    DEVELOPMENT_TEAM: BCBJFS59L9 # Toby's team (set 2026-09-17); XcodeGen keeps it
    CODE_SIGN_STYLE: Automatic
packages:
  JICore:
    path: Packages/JICore
  JIHub:
    path: Packages/JIHub
  JIHealthKit:
    path: Packages/JIHealthKit
  JIPersistence:
    path: Packages/JIPersistence
  JIDesign:
    path: Packages/JIDesign
  JIFeatures:
    path: Packages/JIFeatures
  JISnapshot:
    path: Packages/JISnapshot
targets:
  JournalInsight:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: JournalInsight
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "JournalInsight talks to your HealthTraining hub on the local network."
        CFBundleURLTypes:
          - CFBundleURLSchemes: [ji, journalinsight]
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "PLACEHOLDER — JournalInsight reads health data to compute your daily gate and KPIs." # real copy owed before HealthKit read is wired (W2c+ row, not this lane)
        NSHealthUpdateUsageDescription: "JournalInsight writes your Garmin sleep, heart rate, steps, energy, VO2 max and workouts into Health to fill gaps from when Garmin Connect wasn't syncing." # W2h (B-9)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsight
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # App/Assets.xcassets/AppIcon.appiconset — oracle mobile/assets/icon.png (1024 universal)
        CODE_SIGN_ENTITLEMENTS: App/JournalInsight.entitlements
    dependencies:
      - package: JICore
      - package: JIHub
      - package: JIHealthKit
      - package: JIPersistence
      - package: JIDesign
      - package: JIFeatures
      - package: JISnapshot
      - target: WatchApp
        embed: true
      - target: Widgets
        embed: true
  WatchApp:
    type: application
    platform: watchOS
    sources: [WatchApp/Sources]
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: JournalInsight
        WKApplication: true
        WKCompanionAppBundleIdentifier: toby913.JournalInsight
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsight.watchapp
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        CODE_SIGN_ENTITLEMENTS: WatchApp/WatchApp.entitlements
    dependencies:
      - package: JICore
      - package: JIDesign
      - package: JISnapshot
  Widgets:
    type: app-extension
    platform: iOS
    sources: [Widgets/Sources]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsight.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
    dependencies:
      - package: JICore
      - package: JIDesign
      - package: JISnapshot
  JournalInsightTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: JournalInsight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsightTests
        GENERATE_INFOPLIST_FILE: YES # no `info:` block for this target; without this, codesign fails with "target does not have an Info.plist file"
schemes:
  JournalInsight:
    build:
      targets: { JournalInsight: all, WatchApp: all, Widgets: all, JournalInsightTests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [JournalInsightTests]

name: JournalInsight
options:
  bundleIdPrefix: toby913
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: "YES"
    DEVELOPMENT_TEAM: "" # Toby sets this once in Xcode > Signing; XcodeGen keeps it
    CODE_SIGN_STYLE: Automatic
packages:
  JICore:
    path: Packages/JICore
targets:
  JournalInsight:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: JournalInsight
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "JournalInsight talks to your HealthTraining hub on the local network."
        CFBundleURLTypes:
          - CFBundleURLSchemes: [ji, journalinsight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsight
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: "" # no AppIcon.appiconset yet; XcodeGen's application-target default (AppIcon) fails actool with no icon set present
    dependencies:
      - package: JICore
  JournalInsightTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: JournalInsight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsightTests
        GENERATE_INFOPLIST_FILE: YES # no `info:` block for this target; without this, codesign fails with "target does not have an Info.plist file"
schemes:
  JournalInsight:
    build:
      targets: { JournalInsight: all, JournalInsightTests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [JournalInsightTests]

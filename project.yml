name: JournalInsight
options:
  bundleIdPrefix: toby913
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: "YES"
    DEVELOPMENT_TEAM: BCBJFS59L9 # Toby's team (set 2026-09-17); XcodeGen keeps it
    CODE_SIGN_STYLE: Automatic
packages:
  JICore:
    path: Packages/JICore
  JIHub:
    path: Packages/JIHub
  JIHealthKit:
    path: Packages/JIHealthKit
  JIPersistence:
    path: Packages/JIPersistence
  JIDesign:
    path: Packages/JIDesign
  JIFeatures:
    path: Packages/JIFeatures
  JISnapshot:
    path: Packages/JISnapshot
  JIVault:
    path: Packages/JIVault
  JICompute:
    path: Packages/JICompute
  JIWorkouts: # B-37 (P-workouts): WorkoutKit builder/sender, iOS+watchOS only
    path: Packages/JIWorkouts
targets:
  JournalInsight:
    type: application
    platform: iOS
    # W-FIX5 W5-5: the app starts the verdict Live Activity (`Activity.request` must run in the
    # app, never the extension), so the controller + its cap policy are members of BOTH targets —
    # one `VerdictActivityAttributes` type for the request and the extension's UI.
    sources:
      - App
      - Widgets/Sources/LiveActivityController.swift
      - Widgets/Sources/LiveActivityCapPolicy.swift
      # W-B38-B B-7: the strength-session Live Activity — attributes + controller in both targets.
      - Widgets/Sources/StrengthSessionActivityAttributes.swift
      - Widgets/Sources/StrengthSessionActivityController.swift
      # RG-80: the widget/Live Activity tap URLs, pinned by AppTests against DeepLink.parse.
      - Widgets/Sources/WidgetDeepLinks.swift
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: JournalInsight
        # W-FIX3 fixer BUG-43: the shipped release (Changelog's installed entry). W-FIX11 H2-22: 2.1.0; B-18 p3: 2.2.0. The Watch app and
        # the widget extension carry the same version — an embedded bundle must match its host.
        CFBundleShortVersionString: "2.2.1"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "JournalInsight talks to your HealthTraining hub on the local network."
        CFBundleURLTypes:
          - CFBundleURLSchemes: [ji, journalinsight]
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "JournalInsight reads your Apple Watch sleep, heart rate, HRV, steps, resting and active energy and workouts, plus the food totals (energy, protein, carbs, fat) your food app writes to Health. It uses them for your readiness gate, KPIs and energy balance. Watch data is sent to your own hub; JI never writes food."
        NSHealthUpdateUsageDescription: "JournalInsight writes your Garmin sleep, heart rate, steps, energy, VO2 max and workouts into Health to fill gaps from when Garmin Connect wasn't syncing. If you turn on Mirror mood to Apple Health, it also adds your daily check-in mood as State of Mind (mood only, never your notes)." # W2h (B-9)
        NSCalendarsWriteOnlyAccessUsageDescription: "Planned training sessions go into your calendar as all-day events. JournalInsight only adds events; it never reads your calendar." # W-B96 (B-96)
        # W8-L4 (P-hub-watchdog): `OutboxRetryScheduler.refreshTaskIdentifier` — the BGAppRefreshTask
        # that retries pending outbox rows (weigh-in, gate respond, session feel) off-foreground.
        # W-ONDEVICE O-9: `OnDevicePrewarm.taskIdentifier` — the ~04:45 on-device verdict pre-warm.
        BGTaskSchedulerPermittedIdentifiers: [toby913.JournalInsight.outboxRefresh, toby913.JournalInsight.verdictPrewarm]
        UIBackgroundModes: [fetch]
        # W9.5-L4 (P-today): rotation is a supported feature, not an accident of a missing key —
        # portrait + both landscapes (no upside-down on a phone; NOT `UIRequiresFullScreen`, the
        # app stays multitasking-friendly). `TodayGrid` re-flows its columns via
        # `.adaptive(minimum:)` + `horizontalSizeClass` instead of 2 fixed columns.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # W7-L2 (P-apns-push): the Push Notifications capability is carried by the `aps-environment`
    # (+ `com.apple.developer.usernotifications.time-sensitive`) entitlement in
    # App/JournalInsight.entitlements below — that file IS the capability as far as Xcode 27 and
    # automatic signing are concerned. Deliberately NOT expressed as an `attributes:
    # SystemCapabilities:` block here: XcodeGen 2.45.4 serialises a nested attribute dictionary as
    # its Swift `description` string (`SystemCapabilities = "[\"com.apple.Push\": ...]"`), which
    # is a malformed pbxproj value; `SystemCapabilities` is pre-Xcode-9 legacy that Xcode no longer
    # reads for provisioning anyway.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsight
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # App/Assets.xcassets/AppIcon.appiconset — oracle mobile/assets/icon.png (1024 universal)
        CODE_SIGN_ENTITLEMENTS: App/JournalInsight.entitlements
    dependencies:
      - package: JICore
      - package: JIHub
      - package: JIHealthKit
      - package: JIPersistence
      - package: JIDesign
      - package: JIFeatures
      - package: JISnapshot
      - package: JIVault
      - package: JICompute
      - package: JIWorkouts
      - target: WatchApp
        embed: true
      - target: Widgets
        embed: true
  WatchApp:
    type: application
    platform: watchOS
    sources: [WatchApp/Sources]
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: JournalInsight
        CFBundleShortVersionString: "2.2.1" # W-FIX3 fixer BUG-43: = the host app
        WKApplication: true
        WKCompanionAppBundleIdentifier: toby913.JournalInsight
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # W-B38-B B-1: the Watch runs the strength workout (HKWorkoutSession keeps running with the
        # screen down) and mirrors it to the phone; it reads live HR and saves the HKWorkout.
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: "JournalInsight reads your live heart rate during a strength session to show it against your heart-rate limit."
        NSHealthUpdateUsageDescription: "JournalInsight saves your strength session to Health as a Traditional Strength Training workout."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsight.watchapp
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        CODE_SIGN_ENTITLEMENTS: WatchApp/WatchApp.entitlements
    dependencies:
      - package: JICore
      - package: JIDesign
      - package: JISnapshot
      - package: JIWorkouts # W-B38-B B-1: strength session controller + phone bridge
      - package: JICompute # W-B38-B: SetTimer, LastSetDefaults, SessionCap
      - package: JIPersistence # W-B38-B B-1 (card): local set log on the Watch
  Widgets:
    type: app-extension
    platform: iOS
    sources: [Widgets/Sources]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Widgets
        CFBundleShortVersionString: "2.2.1" # W-FIX3 fixer BUG-43: = the host app
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsight.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
    dependencies:
      - package: JICore
      - package: JIDesign
      - package: JISnapshot
  JournalInsightTests:
    type: bundle.unit-test
    platform: iOS
    # W-FIX5 W5-1: the gate widget's pure medium layout (`GateMediumLayout`) is tested here.
    sources:
      - AppTests
      - Widgets/Sources/GateMediumLayout.swift
    dependencies:
      - target: JournalInsight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsightTests
        GENERATE_INFOPLIST_FILE: YES # no `info:` block for this target; without this, codesign fails with "target does not have an Info.plist file"
  # W-UITEST UT-1 (B-60): the committed XCUITest target — real taps on "iPhone 18 Pro" against the
  # throwaway fixture hub (`bash AppUITests/fixture-hub.sh test`). Every test launches with
  # `-JIForceGate YES` + `-hub-url/-hub-token` (DEBUG launch args, AppEnvironment.launchArgumentConfig).
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
        excludes: ["*.sh", "Fixtures/**"]
    dependencies:
      - target: JournalInsight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsight.uitests
        TEST_TARGET_NAME: JournalInsight
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # XCTestCase's overrides are nonisolated; XCUI test code is not shipped — Swift 5 mode, no
        # MainActor default (the app targets keep Swift 6 + strict concurrency).
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_STRICT_CONCURRENCY: minimal
  WatchAppTests:
    type: bundle.unit-test
    platform: watchOS
    sources: [WatchApp/Tests]
    dependencies:
      - target: WatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsight.watchapp.tests
        GENERATE_INFOPLIST_FILE: YES # no `info:` block for this target; without this, codesign fails with "target does not have an Info.plist file"
schemes:
  JournalInsight:
    build:
      targets: { JournalInsight: all, WatchApp: all, Widgets: all, JournalInsightTests: [test], WatchAppTests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [JournalInsightTests, WatchAppTests]
  # xcodebuild resolves a scheme's compatible test destinations from its Run/Launch action's
  # buildable, which for the JournalInsight scheme is the iOS app — so a watchOS destination
  # is reported incompatible for that scheme even though WatchAppTests is one of its testables.
  # This scheme is the shareable, watchOS-only run/test entry point `xcodebuild test -scheme
  # WatchApp -destination 'platform=watchOS Simulator,...'` needs to actually execute
  # WatchAppTests (see W2d card L5 exit criterion).
  # W-UITEST UT-1: `xcodebuild test -scheme AppUITests -destination 'platform=iOS Simulator,name=iPhone 18 Pro'`
  # — run it through `bash AppUITests/fixture-hub.sh test`, which brings the fixture hub up and down.
  AppUITests:
    build:
      targets: { JournalInsight: all, AppUITests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [AppUITests]
  WatchApp:
    build:
      targets: { WatchApp: all, WatchAppTests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [WatchAppTests]

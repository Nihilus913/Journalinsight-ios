name: JournalInsight
options:
  bundleIdPrefix: toby913
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: "YES"
    DEVELOPMENT_TEAM: BCBJFS59L9 # Toby's team (set 2026-09-17); XcodeGen keeps it
    CODE_SIGN_STYLE: Automatic
packages:
  JICore:
    path: Packages/JICore
  JIHub:
    path: Packages/JIHub
  JIHealthKit:
    path: Packages/JIHealthKit
  JIPersistence:
    path: Packages/JIPersistence
  JIDesign:
    path: Packages/JIDesign
  JIFeatures:
    path: Packages/JIFeatures
  JISnapshot:
    path: Packages/JISnapshot
  JIVault:
    path: Packages/JIVault
  JICompute:
    path: Packages/JICompute
  JIWorkouts: # B-37 (P-workouts): WorkoutKit builder/sender, iOS+watchOS only
    path: Packages/JIWorkouts
targets:
  JournalInsight:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: JournalInsight
        # W-FIX3 fixer BUG-43: the shipped release (Changelog's installed entry). The Watch app and
        # the widget extension carry the same version — an embedded bundle must match its host.
        CFBundleShortVersionString: "2.0.0"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "JournalInsight talks to your HealthTraining hub on the local network."
        CFBundleURLTypes:
          - CFBundleURLSchemes: [ji, journalinsight]
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "JournalInsight reads your Apple Watch sleep, heart rate, HRV, steps, energy and workouts to compute your daily readiness gate and KPIs, and sends them to your own hub."
        NSHealthUpdateUsageDescription: "JournalInsight writes your Garmin sleep, heart rate, steps, energy, VO2 max and workouts into Health to fill gaps from when Garmin Connect wasn't syncing." # W2h (B-9)
        # W8-L4 (P-hub-watchdog): `OutboxRetryScheduler.refreshTaskIdentifier` — the BGAppRefreshTask
        # that retries pending outbox rows (weigh-in, gate respond, session feel) off-foreground.
        BGTaskSchedulerPermittedIdentifiers: [toby913.JournalInsight.outboxRefresh]
        UIBackgroundModes: [fetch]
        # W9.5-L4 (P-today): rotation is a supported feature, not an accident of a missing key —
        # portrait + both landscapes (no upside-down on a phone; NOT `UIRequiresFullScreen`, the
        # app stays multitasking-friendly). `TodayGrid` re-flows its columns via
        # `.adaptive(minimum:)` + `horizontalSizeClass` instead of 2 fixed columns.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # W7-L2 (P-apns-push): the Push Notifications capability is carried by the `aps-environment`
    # (+ `com.apple.developer.usernotifications.time-sensitive`) entitlement in
    # App/JournalInsight.entitlements below — that file IS the capability as far as Xcode 27 and
    # automatic signing are concerned. Deliberately NOT expressed as an `attributes:
    # SystemCapabilities:` block here: XcodeGen 2.45.4 serialises a nested attribute dictionary as
    # its Swift `description` string (`SystemCapabilities = "[\"com.apple.Push\": ...]"`), which
    # is a malformed pbxproj value; `SystemCapabilities` is pre-Xcode-9 legacy that Xcode no longer
    # reads for provisioning anyway.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsight
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # App/Assets.xcassets/AppIcon.appiconset — oracle mobile/assets/icon.png (1024 universal)
        CODE_SIGN_ENTITLEMENTS: App/JournalInsight.entitlements
    dependencies:
      - package: JICore
      - package: JIHub
      - package: JIHealthKit
      - package: JIPersistence
      - package: JIDesign
      - package: JIFeatures
      - package: JISnapshot
      - package: JIVault
      - package: JICompute
      - package: JIWorkouts
      - target: WatchApp
        embed: true
      - target: Widgets
        embed: true
  WatchApp:
    type: application
    platform: watchOS
    sources: [WatchApp/Sources]
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: JournalInsight
        CFBundleShortVersionString: "2.0.0" # W-FIX3 fixer BUG-43: = the host app
        WKApplication: true
        WKCompanionAppBundleIdentifier: toby913.JournalInsight
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsight.watchapp
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        CODE_SIGN_ENTITLEMENTS: WatchApp/WatchApp.entitlements
    dependencies:
      - package: JICore
      - package: JIDesign
      - package: JISnapshot
  Widgets:
    type: app-extension
    platform: iOS
    sources: [Widgets/Sources]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Widgets
        CFBundleShortVersionString: "2.0.0" # W-FIX3 fixer BUG-43: = the host app
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsight.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
    dependencies:
      - package: JICore
      - package: JIDesign
      - package: JISnapshot
  JournalInsightTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: JournalInsight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsightTests
        GENERATE_INFOPLIST_FILE: YES # no `info:` block for this target; without this, codesign fails with "target does not have an Info.plist file"
  WatchAppTests:
    type: bundle.unit-test
    platform: watchOS
    sources: [WatchApp/Tests]
    dependencies:
      - target: WatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: toby913.JournalInsight.watchapp.tests
        GENERATE_INFOPLIST_FILE: YES # no `info:` block for this target; without this, codesign fails with "target does not have an Info.plist file"
schemes:
  JournalInsight:
    build:
      targets: { JournalInsight: all, WatchApp: all, Widgets: all, JournalInsightTests: [test], WatchAppTests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [JournalInsightTests, WatchAppTests]
  # xcodebuild resolves a scheme's compatible test destinations from its Run/Launch action's
  # buildable, which for the JournalInsight scheme is the iOS app — so a watchOS destination
  # is reported incompatible for that scheme even though WatchAppTests is one of its testables.
  # This scheme is the shareable, watchOS-only run/test entry point `xcodebuild test -scheme
  # WatchApp -destination 'platform=watchOS Simulator,...'` needs to actually execute
  # WatchAppTests (see W2d card L5 exit criterion).
  WatchApp:
    build:
      targets: { WatchApp: all, WatchAppTests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [WatchAppTests]
